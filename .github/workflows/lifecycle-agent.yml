name: lifecycle agent

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for every job; a private repository passes serio-runner, the self-hosted runner set up by serio-ngo/ops lifecycle/runner.ps1
        type: string
        default: ubuntu-latest
      focus_ref:
        description: serio-focus ref that holds the trusted scripts
        type: string
        default: main
      orchestrator:
        description: Model of the main session of every stage
        type: string
        default: opus
      plugin_marketplaces:
        description: Empty means serio-focus at focus_ref, so skills, hooks and scripts come from one ref
        type: string
        default: ""
      plugins:
        type: string
        default: serio-focus@serio-ngo
      node:
        type: string
        default: "24"
      setup:
        description: Install command the repository declares
        type: string
        default: if [ -f package-lock.json ]; then npm ci; fi
      e2e_setup:
        description: Browser install command the repository declares for end-to-end tests
        type: string
        default: if ls playwright.config.* >/dev/null 2>&1; then npx playwright install $([ "$RUNNER_ENVIRONMENT" = github-hosted ] && echo --with-deps) chromium; fi
      bot:
        description: Slug of the GitHub App whose key is AGENT_APP_KEY; it pushes the run's commits and authors them
        type: string
        default: serio-agent

permissions: {}

jobs:
  route:
    name: route
    if: >-
      (github.event_name != 'issues' || contains(fromJSON('["spec-review","spec-ok","tests-ok"]'), github.event.label.name)) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure') &&
      (github.event_name != 'pull_request_review' || github.event.review.state != 'approved' || contains(github.event.review.body, 'tests-ok'))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    outputs:
      stage: ${{ steps.route.outputs.stage }}
      issue: ${{ steps.route.outputs.issue }}
      pr: ${{ steps.route.outputs.pr }}
      ref: ${{ steps.route.outputs.ref }}
      focus: ${{ steps.route.outputs.focus }}
      sha: ${{ steps.route.outputs.sha }}
      spec: ${{ steps.route.outputs.spec }}
      secret: ${{ steps.route.outputs.secret }}
      bot: ${{ steps.route.outputs.bot }}
      bypass: ${{ steps.route.outputs.bypass }}
      turns: ${{ steps.route.outputs.turns }}
      timeout: ${{ steps.route.outputs.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: serio-ngo/serio-focus
          ref: ${{ inputs.focus_ref }}
          persist-credentials: false
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: node plugins/serio-focus/scripts/lifecycle/route.mjs

  agent:
    name: ${{ needs.route.outputs.stage || 'agent' }}
    needs: route
    if: needs.route.outputs.stage != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.route.outputs.timeout) }}
    permissions:
      contents: read
      packages: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      stats: ${{ steps.trace.outputs.stats }}
      transcript: ${{ steps.transcript.outputs.artifact-id }}
      eval: eval-${{ needs.route.outputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - id: bot
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.bot }}
        run: gh api "users/${SLUG}%5Bbot%5D" --jq '"id=\(.id)"' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.route.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node }}
      - name: Install dependencies
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bash -c "$SETUP"
      - name: Install browsers
        if: needs.route.outputs.stage != 'spec-review' && inputs.e2e_setup != ''
        env:
          E2E_SETUP: ${{ inputs.e2e_setup }}
        run: bash -c "$E2E_SETUP"
      - name: Plugin at the pinned ref
        env:
          REF: ${{ needs.route.outputs.focus || inputs.focus_ref }}
        run: |
          d="$RUNNER_TEMP/serio-focus"; git init -q "$d"
          git -C "$d" fetch -q --depth 1 https://github.com/serio-ngo/serio-focus.git "$REF"
          git -C "$d" checkout -q FETCH_HEAD
      - name: Ponytail at the pinned commit
        run: |
          d="$RUNNER_TEMP/ponytail"; git init -q "$d"
          git -C "$d" fetch -q --depth 1 https://github.com/DietrichGebert/ponytail.git 7801d061243d7b753bad0e0b3c057cd250b11755
          git -C "$d" checkout -q FETCH_HEAD
      - name: Brief
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.issue }}
        run: |
          mkdir -p .lifecycle && echo .lifecycle/ >> .git/info/exclude
          node "$RUNNER_TEMP/serio-focus/plugins/serio-focus/scripts/lifecycle/brief.mjs" "$ISSUE" > .lifecycle/task.md
      - id: args
        env:
          STAGE: ${{ needs.route.outputs.stage }}
          ISSUE: ${{ needs.route.outputs.issue }}
          PR: ${{ needs.route.outputs.pr }}
          TURNS: ${{ needs.route.outputs.turns }}
          MODEL: ${{ inputs.orchestrator }}
        run: node "$RUNNER_TEMP/serio-focus/plugins/serio-focus/scripts/lifecycle/args.mjs"
      - id: seat
        env:
          TOKEN: ${{ secrets[needs.route.outputs.secret] }}
        run: |
          token="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@e5812cd75691ca7bbfc57c0ecf4441db3a1ab7dd
        env:
          GH_TOKEN: ${{ github.token }}
          SERIO_UNATTENDED: "1"
          SERIO_ORCHESTRATE: ${{ needs.route.outputs.stage != 'spec-review' && '1' || '' }}
          # One-shot run: a background subagent outlives the session's last turn (run 43271348109)
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS: "4"
          CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH: "1"
        with:
          claude_code_oauth_token: ${{ steps.seat.outputs.token }}
          github_token: ${{ github.token }}
          bot_name: ${{ inputs.bot }}[bot]
          bot_id: ${{ steps.bot.outputs.id }}
          allowed_bots: ${{ needs.route.outputs.bot == 'true' && inputs.bot || '' }}
          plugin_marketplaces: |-
            ${{ inputs.plugin_marketplaces || format('{0}/serio-focus', runner.temp) }}
            ${{ runner.temp }}/ponytail
          plugins: |-
            ${{ inputs.plugins }}
            ponytail@ponytail
          prompt: ${{ steps.args.outputs.prompt }}
          claude_args: ${{ steps.args.outputs.args }}
          restrict_untrusted_prs: ${{ startsWith(needs.route.outputs.ref, 'agent/') && 'false' || 'true' }}
      - name: Trace
        id: trace
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
          STAGE: ${{ needs.route.outputs.stage }}
          ISSUE: ${{ needs.route.outputs.issue }}
          BYPASS: ${{ needs.route.outputs.bypass }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          publish="$RUNNER_TEMP/serio-focus/plugins/serio-focus/scripts/lifecycle/publish.mjs"
          {
            echo '```text'
            PRIVATE=false node "$publish" --log "$LOG" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node "$publish" --log "$LOG" || true
          jq -r --arg stage "$STAGE" '[.[] | select(.type == "result")] | last // {} | if .subtype == "success" and .is_error == false and ($stage != "spec-review" or .structured_output != null) then "finished=true" else empty end' "$LOG" >> "$GITHUB_OUTPUT" || true
          node "$publish" --outcome "$LOG" >> "$GITHUB_OUTPUT" || true
      - id: transcript
        if: always() && steps.claude.outputs.execution_file != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: transcript
          path: ${{ runner.temp }}/transcript.jsonl
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
      - name: Hand the commits to the publish job
        if: needs.route.outputs.stage != 'spec-review' && steps.trace.outputs.finished == 'true'
        env:
          BEFORE: ${{ needs.route.outputs.sha || format('origin/{0}', github.event.repository.default_branch) }}
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          git branch --show-current > "$out/ref"
          git bundle create "$out/commits.bundle" "$BEFORE..HEAD" || rm -f "$out/commits.bundle"
          cp .lifecycle/pr.md "$out/" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.route.outputs.stage != 'spec-review' && steps.trace.outputs.finished == 'true'
        with:
          name: commits
          path: ${{ runner.temp }}/out
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: eval-${{ needs.route.outputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eval.json
          if-no-files-found: ignore
      - name: Fail a run without a finished result
        if: always() && steps.trace.outputs.finished != 'true'
        run: exit 1

  publish:
    name: publish
    needs: [route, agent]
    if: always() && needs.route.outputs.stage != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: serio-ngo/serio-focus
          ref: ${{ inputs.focus_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: ${{ needs.agent.outputs.eval }}
          path: ${{ runner.temp }}/eval
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.agent.outputs.transcript != ''
        continue-on-error: true
        with:
          name: transcript
          path: ${{ runner.temp }}/transcript
      - id: archive_app
        if: always() && needs.agent.outputs.transcript != ''
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_KEY }}
          owner: serio-ngo
          repositories: lifecycle-runs
      - name: Archive the run
        if: always() && needs.agent.outputs.transcript != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.archive_app.outputs.token }}
          RUN_TOKEN: ${{ github.token }}
          STAGE: ${{ needs.route.outputs.stage }}
          ARTIFACT: ${{ needs.agent.outputs.transcript }}
          PRIVATE: ${{ github.event.repository.private }}
          TRANSCRIPT: ${{ runner.temp }}/transcript/transcript.jsonl
        run: node plugins/serio-focus/scripts/lifecycle/publish.mjs --archive --eval "$RUNNER_TEMP/eval/eval.json"
      - name: Publish the spec review
        if: needs.route.outputs.stage == 'spec-review' && needs.agent.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.issue }}
          SPEC_SHA: ${{ needs.route.outputs.spec }}
          STATS: ${{ needs.agent.outputs.stats }}
          STAGE: ${{ needs.route.outputs.stage }}
        run: node plugins/serio-focus/scripts/lifecycle/publish.mjs "$ISSUE" --eval "$RUNNER_TEMP/eval/eval.json"
      - id: app
        if: needs.route.outputs.stage != 'spec-review' && needs.agent.result == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_KEY }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.app.outcome == 'success'
        continue-on-error: true
        with:
          name: commits
          path: ${{ runner.temp }}/out
      - name: Push the run's commits
        id: push
        if: steps.app.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OUT: ${{ runner.temp }}/out
          ISSUE: ${{ needs.route.outputs.issue }}
          REF: ${{ needs.route.outputs.ref }}
          STAGE: ${{ needs.route.outputs.stage }}
        run: node plugins/serio-focus/scripts/lifecycle/push.mjs
      - name: Park a run without a push
        if: needs.route.outputs.stage != 'spec-review' && needs.agent.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.issue }}
          BEFORE_SHA: ${{ needs.route.outputs.sha }}
          SPEC_SHA: ${{ needs.route.outputs.spec }}
          PUSHED_SHA: ${{ steps.push.outputs.head }}
          STATS: ${{ needs.agent.outputs.stats }}
          STAGE: ${{ needs.route.outputs.stage }}
        run: node plugins/serio-focus/scripts/lifecycle/publish.mjs "$ISSUE" --pushed --eval "$RUNNER_TEMP/eval/eval.json"
      - name: Park a failed run
        if: needs.agent.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ needs.route.outputs.stage }}
          TARGET: ${{ needs.route.outputs.pr || needs.route.outputs.issue }}
          STATS: ${{ needs.agent.outputs.stats }}
        run: node plugins/serio-focus/scripts/lifecycle/publish.mjs "$TARGET" --failed "$STAGE" --eval "$RUNNER_TEMP/eval/eval.json"
