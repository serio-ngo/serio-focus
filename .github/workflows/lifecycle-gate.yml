name: lifecycle gate

on:
  workflow_call:
    inputs:
      focus_ref:
        description: serio-focus ref that holds the trusted scripts
        type: string
        default: main
      node:
        type: string
        default: "24"
      gates:
        description: The repository's own gate command
        type: string
        default: npm run build --if-present
      unit:
        type: string
        default: node --test --test-reporter=junit --test-reporter-destination=junit/unit.xml
      e2e:
        description: Runs only when a Playwright config exists
        type: string
        default: npx playwright test --reporter=junit

permissions: {}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node }}
      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Gates
        if: inputs.gates != ''
        env:
          COMMAND: ${{ inputs.gates }}
        run: bash -c "$COMMAND"
      - name: Unit tests
        if: ${{ !cancelled() }}
        env:
          COMMAND: ${{ inputs.unit }}
        run: mkdir -p junit && bash -c "$COMMAND"
      - name: Install browsers
        if: ${{ !cancelled() && hashFiles('playwright.config.*') != '' }}
        run: npx playwright install --with-deps chromium
      - name: e2e tests
        if: ${{ !cancelled() && hashFiles('playwright.config.*') != '' }}
        env:
          COMMAND: ${{ inputs.e2e }}
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: junit/e2e.xml
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit/e2e.xml
        run: bash -c "$COMMAND"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: junit
          path: junit
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: e2e-traces
          path: test-results
          if-no-files-found: ignore
      - name: Revert check
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          FOCUS_REF: ${{ inputs.focus_ref }}
          UNIT: ${{ inputs.gates != '' && format('{0} && {1}', inputs.gates, inputs.unit) || inputs.unit }}
          E2E: ${{ hashFiles('playwright.config.*') != '' && inputs.e2e || '' }}
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: junit/e2e.xml
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit/e2e.xml
        run: |
          d="$RUNNER_TEMP/serio-focus"; git init -q "$d"
          git -C "$d" fetch -q --depth 1 https://github.com/serio-ngo/serio-focus.git "$FOCUS_REF"
          git -C "$d" checkout -q FETCH_HEAD
          node "$d/plugins/serio-focus/scripts/lifecycle/acceptance.mjs" --revert
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
        with:
          name: revert
          path: revert
          if-no-files-found: ignore

  control:
    name: lock and acceptance
    needs: tests
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      TESTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: serio-ngo/serio-focus
          ref: ${{ inputs.focus_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: junit
          path: ${{ runner.temp }}/junit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: revert
          path: ${{ runner.temp }}/revert
      - id: lock
        name: Test lock
        run: node plugins/serio-focus/scripts/lifecycle/lock.mjs "$PR"
      - name: Acceptance report
        continue-on-error: ${{ steps.lock.outputs.locked != 'true' }}
        env:
          LOCK_NOTE: ${{ steps.lock.outputs.note }}
          RESULTS: ${{ runner.temp }}/junit
          REVERT: ${{ runner.temp }}/revert
        run: node plugins/serio-focus/scripts/lifecycle/acceptance.mjs "$PR" "$RESULTS" --post
      - name: Gate record
        if: always()
        continue-on-error: true
        env:
          LOCK: ${{ steps.lock.outcome }}
          LOCK_NOTE: ${{ steps.lock.outputs.note }}
          RESULTS: ${{ runner.temp }}/junit
          REVERT: ${{ runner.temp }}/revert
          TESTS: ${{ needs.tests.result }}
        run: VERIFIER=$(git rev-parse HEAD) node plugins/serio-focus/scripts/lifecycle/acceptance.mjs "$PR" "$RESULTS" --record "$RUNNER_TEMP/gate.json"
      - id: archive-token
        if: always()
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_KEY }}
          owner: serio-ngo
          repositories: lifecycle-runs
      - name: Archive gate result
        if: always() && steps.archive-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.archive-token.outputs.token }}
        run: node plugins/serio-focus/scripts/lifecycle/publish.mjs --gate "$RUNNER_TEMP/gate.json"
      - name: Tests job
        if: steps.lock.outputs.locked == 'true' && needs.tests.result != 'success'
        run: exit 1
