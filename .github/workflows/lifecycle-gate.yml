name: lifecycle gate

on:
  workflow_call:
    inputs:
      focus_ref:
        description: serio-focus ref that holds the trusted scripts
        type: string
        default: main
      node:
        type: string
        default: "22"
      gates:
        description: The repository's own gate command; empty runs none
        type: string
        default: ""
      unit:
        type: string
        default: node --test --test-reporter=junit --test-reporter-destination=junit/unit.xml
      e2e:
        description: Runs only when a Playwright config exists
        type: string
        default: npx playwright test --reporter=junit

permissions: {}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node }}
      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Gates
        if: inputs.gates != ''
        env:
          COMMAND: ${{ inputs.gates }}
        run: bash -c "$COMMAND"
      - name: Unit tests
        if: ${{ !cancelled() }}
        env:
          COMMAND: ${{ inputs.unit }}
        run: mkdir -p junit && bash -c "$COMMAND"
      - name: Install browsers
        if: ${{ !cancelled() && hashFiles('playwright.config.*') != '' }}
        run: npx playwright install --with-deps chromium
      - name: e2e tests
        if: ${{ !cancelled() && hashFiles('playwright.config.*') != '' }}
        env:
          COMMAND: ${{ inputs.e2e }}
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: junit/e2e.xml
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit/e2e.xml
        run: bash -c "$COMMAND"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: junit
          path: junit
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: e2e-traces
          path: test-results
          if-no-files-found: ignore

  control:
    name: lock and acceptance
    needs: tests
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: serio-ngo/serio-focus
          ref: ${{ inputs.focus_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: junit
          path: ${{ runner.temp }}/junit
      - id: lock
        name: Test lock
        run: node plugins/serio-focus/scripts/lifecycle/lock.mjs "$PR"
      - name: Acceptance report
        continue-on-error: ${{ steps.lock.outputs.locked != 'true' }}
        env:
          LOCK_NOTE: ${{ steps.lock.outputs.note }}
          RESULTS: ${{ runner.temp }}/junit
        run: node plugins/serio-focus/scripts/lifecycle/acceptance.mjs "$PR" "$RESULTS" --post
      - name: Tests job
        if: steps.lock.outputs.locked == 'true' && needs.tests.result != 'success'
        run: exit 1
