<text x="22" y="60" fill="#57606a" font-size="12" class="row d0">$ claude</text>
<clipPath id="t"><rect class="typed" x="22" y="70" height="18"/></clipPath>
<g class="row d1" clip-path="url(#t)"><text x="22" y="84" fill="#24292f" font-size="12" font-weight="600">&gt; tidy the repo and push it.</text></g>
<text x="22" y="108" fill="#24292f" font-size="12" font-weight="600" class="row d2">⏺  Bash · git status</text>
<text x="22" y="132" fill="#24292f" font-size="12" font-weight="600" class="row d3">⏺  Agent · fourth direct call</text>
<rect class="row d4" x="14" y="140" width="844" height="22" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-opacity=".45"/>
<text x="22" y="156" fill="#cf222e" font-size="12" class="row d4">⨯  FAN-OUT CAP: subagent 4 held. Next: wait one wave</text>
<text x="22" y="180" fill="#24292f" font-size="12" font-weight="600" class="row d5">⏺  Bash · git push origin main</text>
<rect class="row d6" x="14" y="188" width="844" height="46" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-opacity=".45"/>
<text x="22" y="204" fill="#cf222e" font-size="12" class="row d6">⨯  GIT WRITE: &quot;git push origin main&quot; commit and push stays manual — draft the exact command and list</text>
<text x="22" y="228" fill="#cf222e" font-size="12" class="row d7">   it in the final state, do not run it</text>
<text x="22" y="252" fill="#24292f" font-size="12" font-weight="600" class="row d8">⏺  Bash · rm -rf src</text>
<rect class="row d9" x="14" y="260" width="844" height="46" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-opacity=".45"/>
<text x="22" y="276" fill="#cf222e" font-size="12" class="row d9">⨯  DELETE LOCK: &quot;rm -rf src&quot; recursive delete stays manual — use literal paths inside the temp dir</text>
<text x="22" y="300" fill="#cf222e" font-size="12" class="row d10">   or an ignored build dir, or list the exact command for the owner</text>
<rect class="row d11" x="14" y="307" width="844" height="30" rx="4" fill="none" stroke="#d0d7de"/>
<text x="22" y="324" fill="#57606a" font-size="12" font-weight="600" class="row d11">SERIO FOCUS · 3 holds written to the audit log</text>
